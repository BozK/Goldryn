# Expects /srv/goldryn/{app,data,.env}; this file lives in app/. See DEPLOY.md.
# app/.env is a symlink to ../.env, so compose can read APP_UID/APP_GID below.
name: goldryn

services:
  goldryn:
    build:
      context: .
      args:
        # The goldryn system user that owns ../data. No default: never fall back to the login user's UID
        UID: ${APP_UID:?APP_UID missing, see DEPLOY.md}
        GID: ${APP_GID:?APP_GID missing, see DEPLOY.md}
    restart: unless-stopped
    env_file: ../.env
    # No FORWARDED_ALLOW_IPS: the app takes the client IP from Cloudflare's
    # CF-Connecting-IP header (logger.py), never from the socket or X-Forwarded-For.
    ports:
      # Keep the 127.0.0.1 prefix: Docker-published ports bypass ufw.
      # The app listens on 8000 in the container; 8000 and 8001 are taken on the host.
      - "127.0.0.1:8002:8000"
    volumes:
      - ../data/db:/app/data
      - ../data/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
